name: Update data.json from CSV

on:
  push:
    paths:
      - "listings_investment_scored.csv"
      - "feature_matrix.csv"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run generator script
        run: python generate_data.py

      - name: Commit updated data.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet && echo "No changes to commit" || \
            git commit -m "chore: auto-update data.json [skip ci]"
          git push

      - name: Purge jsDelivr cache
        run: |
          curl -s "https://purge.jsdelivr.net/gh/AbhishekBits97/realestate_ai@main/data.json" \
            -o /dev/null -w "jsDelivr purge status: %{http_code}\n"
